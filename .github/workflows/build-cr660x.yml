name: Build CR660x

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git \
            gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz libnsl-dev ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip upx-ucl vim wget \
            xmlto xxd xz-utils zlib1g-dev
          sudo apt-get clean

      - name: Clone Lean LEDE
        run: |
          git clone --depth=1 --branch master \
            https://github.com/coolsnowwolf/lede.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and verify CR660x
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x=y
          CONFIG_PACKAGE_luci=y
          EOF

          make defconfig

          disabled_packages=(
            luci-app-accesscontrol
            luci-app-arpbind
            luci-app-autoreboot
            luci-app-ddns
            luci-app-filetransfer
            luci-app-nlbwmon
            luci-app-ssr-plus
            luci-app-turboacc
            luci-app-upnp
            luci-app-vlmcsd
            luci-app-vsftpd
            luci-app-wol
            coremark
            vlmcsd
            vsftpd
            nlbwmon
            microsocks
            ipt2socks
            nping
          )

          disable_symbol() {
            local symbol="$1"
            sed -i \
              -e "/^${symbol}=.*/d" \
              -e "/^# ${symbol} is not set$/d" \
              .config
            echo "# ${symbol} is not set" >> .config
          }

          for package in "${disabled_packages[@]}"; do
            disable_symbol "CONFIG_DEFAULT_${package}"
            disable_symbol "CONFIG_PACKAGE_${package}"
          done

          make defconfig

          echo "===== Selected target ====="
          grep -E \
            '^CONFIG_TARGET_ramips=y$|^CONFIG_TARGET_ramips_mt7621=y$|^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x=y$' \
            .config

          echo "===== LuCI ====="
          grep '^CONFIG_PACKAGE_luci=y$' .config

          echo "===== Enabled LuCI applications ====="
          grep '^CONFIG_PACKAGE_luci-app-.*=y$' .config || true

          required_options=(
            CONFIG_TARGET_ramips
            CONFIG_TARGET_ramips_mt7621
            CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x
            CONFIG_PACKAGE_luci
          )

          failed=0

          echo "===== Verify required options ====="
          for option in "${required_options[@]}"; do
            if grep -qx "${option}=y" .config; then
              echo "OK: ${option}=y"
            else
              echo "ERROR: ${option} is not enabled"
              failed=1
            fi
          done

          echo "===== Verify excluded packages ====="
          for package in "${disabled_packages[@]}"; do
            if grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "ERROR: ${package} was re-enabled by a dependency"
              failed=1
            else
              echo "OK: ${package} is disabled"
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "Configuration verification failed; build stopped."
            exit 1
          fi

          echo "Configuration verified successfully."

      - name: Download sources using all CPUs
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading with $(nproc) parallel jobs"
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware using all CPUs
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with $(nproc) CPU threads"
          make -j"$(nproc)" V=s

      - name: Collect firmware
        run: |
          mkdir -p firmware

          find openwrt/bin/targets/ramips/mt7621 \
            -maxdepth 1 -type f \
            \( -name '*cr660x*.bin' \
            -o -name '*cr660x*.manifest' \
            -o -name 'sha256sums' \
            -o -name 'profiles.json' \) \
            -exec cp -v {} firmware/ \;

          cp openwrt/.config firmware/config.txt

          echo "===== Firmware files ====="
          ls -lh firmware

          test -n "$(find firmware -type f -name '*cr660x*.bin' -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lean-LEDE-CR660x
          path: firmware/
          retention-days: 30
          if-no-files-found: error
