name: Build CR660x

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Choose fastest APT mirror
        uses: vegardit/fast-apt-mirror.sh@v1
        with:
          healthchecks: 20
          speedtests: 10
          parallel: 2
          sample-size: 1024
          sample-time: 3
          configure-mirror: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git \
            gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz libnsl-dev ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip upx-ucl vim wget \
            xmlto xxd xz-utils zlib1g-dev

      - name: Clone Lean LEDE
        run: |
          git clone --depth=1 --branch master \
            https://github.com/coolsnowwolf/lede.git openwrt

      - name: Remove default packages
        working-directory: openwrt
        shell: bash
        run: |
          packages=(
            coremark
            ddns-scripts_aliyun
            ddns-scripts_dnspod
            luci-app-accesscontrol
            luci-app-arpbind
            luci-app-autoreboot
            luci-app-ddns
            luci-app-filetransfer
            luci-app-nlbwmon
            luci-app-ssr-plus
            luci-app-turboacc
            luci-app-upnp
            luci-app-vlmcsd
            luci-app-vsftpd
            luci-app-wol
          )

          for package in "${packages[@]}"; do
            sed -i -E \
              "s/(^|[[:space:]])${package}([[:space:]]|\\\\)/\\1\\2/g" \
              include/target.mk
          done

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure CR660x
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x=y
          EOF

          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          echo "Building with $(nproc) CPU threads"
          make -j"$(nproc)"

      - name: Collect firmware
        run: |
          mkdir -p firmware

          find openwrt/bin/targets/ramips/mt7621 \
            -maxdepth 1 -type f \
            \( -name '*cr660x*.bin' \
            -o -name '*cr660x*.manifest' \
            -o -name 'sha256sums' \
            -o -name 'profiles.json' \) \
            -exec cp -v {} firmware/ \;

          cp openwrt/.config firmware/config.txt
          ls -lh firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lean-LEDE-CR660x
          path: firmware/
          retention-days: 30
          if-no-files-found: error
