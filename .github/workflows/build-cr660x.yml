name: Build CR660x

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git \
            gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz libnsl-dev \
            ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs unzip upx-ucl vim wget \
            xmlto xxd xz-utils zlib1g-dev

      - name: Clone Lean LEDE
        run: |
          git clone --depth=1 \
            --branch master \
            https://github.com/coolsnowwolf/lede.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure CR660x
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x=y

          CONFIG_PACKAGE_luci=y
          EOF

          make defconfig

          echo "===== Selected target ====="
          grep -E "CONFIG_TARGET_ramips|cr660x" .config

          echo "===== LuCI ====="
          grep "CONFIG_PACKAGE_luci=" .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p firmware

          find openwrt/bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*cr660x*.bin" \
              -o -name "*cr660x*.manifest" \
              -o -name "sha256sums" \
              -o -name "profiles.json" \
            \) \
            -exec cp -v {} firmware/ \;

          cp openwrt/.config firmware/config.txt

          echo "===== Firmware files ====="
          ls -lh firmware

          test -n "$(find firmware -name '*cr660x*.bin' -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lean-LEDE-CR660x
          path: firmware/
          retention-days: 30
          if-no-files-found: error
