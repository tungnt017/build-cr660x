name: Build CR660x

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git \
            gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz libnsl-dev ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip upx-ucl vim wget \
            xmlto xxd xz-utils zlib1g-dev
          sudo apt-get clean

      - name: Clone Lean LEDE
        run: |
          git clone --depth=1 --branch master \
            https://github.com/coolsnowwolf/lede.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and verify before build
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x=y
          CONFIG_PACKAGE_luci=y
          CONFIG_TARGET_DEVICE_PACKAGES_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x="-coremark -curl -ddns-scripts -ddns-scripts-services -ddns-scripts_aliyun -ddns-scripts_dnspod -dns2tcp -etherwake -luci-app-accesscontrol -luci-app-arpbind -luci-app-autoreboot -luci-app-ddns -luci-app-filetransfer -luci-app-nlbwmon -luci-app-oui -luci-app-ssr-plus -luci-app-turboacc -luci-app-upnp -luci-app-vlmcsd -luci-app-vsftpd -luci-app-wol -miniupnpd-nftables -microsocks -ipt2socks -nlbwmon -nping -shellsync -vlmcsd -vsftpd"
          EOF

          make defconfig

          required_options=(
            CONFIG_TARGET_ramips
            CONFIG_TARGET_ramips_mt7621
            CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x
            CONFIG_PACKAGE_luci
            CONFIG_PACKAGE_kmod-mt7915e
            CONFIG_PACKAGE_kmod-mt7915-firmware
            CONFIG_PACKAGE_wpad-openssl
            CONFIG_PACKAGE_uboot-envtools
          )

          excluded_packages=(
            coremark
            curl
            ddns-scripts
            ddns-scripts-services
            ddns-scripts_aliyun
            ddns-scripts_dnspod
            dns2tcp
            etherwake
            luci-app-accesscontrol
            luci-app-arpbind
            luci-app-autoreboot
            luci-app-ddns
            luci-app-filetransfer
            luci-app-nlbwmon
            luci-app-oui
            luci-app-ssr-plus
            luci-app-turboacc
            luci-app-upnp
            luci-app-vlmcsd
            luci-app-vsftpd
            luci-app-wol
            miniupnpd-nftables
            microsocks
            ipt2socks
            nlbwmon
            nping
            shellsync
            vlmcsd
            vsftpd
          )

          failed=0

          echo "===== Required configuration ====="
          for option in "${required_options[@]}"; do
            if grep -qx "${option}=y" .config; then
              echo "OK: ${option}=y"
            else
              echo "ERROR: ${option} is not enabled"
              failed=1
            fi
          done

          echo "===== Device package exclusions ====="
          device_packages="$(sed -n 's/^CONFIG_TARGET_DEVICE_PACKAGES_ramips_mt7621_DEVICE_xiaomi_mi-router-cr660x="\(.*\)"$/\1/p' .config)"

          if [ -z "${device_packages}" ]; then
            echo "ERROR: device package exclusion list is missing"
            failed=1
          fi

          for package in "${excluded_packages[@]}"; do
            if printf '%s\n' "${device_packages}" | tr ' ' '\n' | grep -Fqx -- "-${package}"; then
              echo "OK: -${package}"
            else
              echo "ERROR: -${package} is missing from device exclusions"
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "Pre-build configuration verification failed."
            exit 1
          fi

          echo "Pre-build configuration verified successfully."

      - name: Download sources using all CPUs
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading with $(nproc) parallel jobs"
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware using all CPUs
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with $(nproc) CPU threads"
          make -j"$(nproc)"

      - name: Verify firmware after build
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          target_dir="bin/targets/ramips/mt7621"
          manifest="$(find "${target_dir}" -maxdepth 1 -type f -name '*cr660x*.manifest' -print -quit)"

          if [ -z "${manifest}" ]; then
            echo "ERROR: CR660x manifest not found"
            exit 1
          fi

          forbidden_packages=(
            coremark curl ddns-scripts ddns-scripts-services
            ddns-scripts_aliyun ddns-scripts_dnspod dns2tcp etherwake
            luci-app-accesscontrol luci-app-arpbind luci-app-autoreboot
            luci-app-ddns luci-app-filetransfer luci-app-nlbwmon
            luci-app-oui luci-app-ssr-plus luci-app-turboacc
            luci-app-upnp luci-app-vlmcsd luci-app-vsftpd luci-app-wol
            miniupnpd-nftables microsocks ipt2socks nlbwmon nping
            shellsync vlmcsd vsftpd
          )

          required_packages=(
            base-files busybox dnsmasq-full dropbear firewall4 luci
            luci-app-firewall kmod-mt7915e kmod-mt7915-firmware
            wpad-openssl uboot-envtools
          )

          failed=0

          echo "===== Forbidden packages ====="
          for package in "${forbidden_packages[@]}"; do
            if awk -v pkg="${package}" '$1 == pkg { found=1 } END { exit !found }' "${manifest}"; then
              echo "ERROR: ${package} exists in firmware"
              failed=1
            else
              echo "OK: ${package} is absent"
            fi
          done

          echo "===== Required packages ====="
          for package in "${required_packages[@]}"; do
            if awk -v pkg="${package}" '$1 == pkg { found=1 } END { exit !found }' "${manifest}"; then
              echo "OK: ${package} exists"
            else
              echo "ERROR: required package ${package} is missing"
              failed=1
            fi
          done

          factory="$(find "${target_dir}" -maxdepth 1 -type f -name '*cr660x*factory.bin' -print -quit)"
          sysupgrade="$(find "${target_dir}" -maxdepth 1 -type f -name '*cr660x*sysupgrade.bin' -print -quit)"

          [ -n "${factory}" ] || { echo "ERROR: factory image is missing"; failed=1; }
          [ -n "${sysupgrade}" ] || { echo "ERROR: sysupgrade image is missing"; failed=1; }

          if [ "${failed}" -ne 0 ]; then
            echo "Firmware verification failed."
            exit 1
          fi

          echo "OK: factory image exists"
          echo "OK: sysupgrade image exists"
          echo "Firmware verified successfully."

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/ramips/mt7621 \
            -maxdepth 1 -type f \
            \( -name '*cr660x*.bin' \
            -o -name '*cr660x*.manifest' \
            -o -name 'sha256sums' \
            -o -name 'profiles.json' \) \
            -exec cp -v {} firmware/ \;
          cp openwrt/.config firmware/config.txt
          ls -lh firmware

      - name: Upload verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lean-LEDE-CR660x
          path: firmware/
          retention-days: 30
          if-no-files-found: error
